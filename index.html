<!DOCTYPE html>

    <style>
        html, body {
            height: 100vh;
            height: 100dvh;
            width: 100vw;
            margin: 0;
            padding: 0;
            overflow: hidden !important;
            touch-action: manipulation;
            font-family: 'Fredoka', 'Comic Sans MS', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        /* SCREEN SHAKE ANIMATION ON VICTORY */
        @keyframes screenShake {
            0% { transform: translate(0, 0) rotate(0deg); }
            15% { transform: translate(-10px, 8px) rotate(-1.5deg); }
            30% { transform: translate(10px, -8px) rotate(1.5deg); }
            45% { transform: translate(-8px, -5px) rotate(-1deg); }
            60% { transform: translate(8px, 5px) rotate(1deg); }
            75% { transform: translate(-4px, 2px) rotate(0deg); }
            100% { transform: translate(0, 0) rotate(0deg); }
        }

        .animate-screen-shake {
            animation: screenShake 0.65s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* KEYBOARD & SLOT SHAKE ANIMATION ON WRONG ANSWER */
        @keyframes keyErrorShake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-10px); }
            40%, 80% { transform: translateX(10px); }
        }

        .animate-shake {
            animation: keyErrorShake 0.4s cubic-bezier(.36,.07,.19,.97) both;
        }

        /* DYNAMIC GIF EMULATION ANIMATIONS FOR EMOJIS */
        @keyframes gifBounce {
            0%, 100% { transform: translateY(0) scale(1); }
            50% { transform: translateY(-16px) scale(1.08); }
        }

        @keyframes gifPulse {
            0%, 100% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.15) rotate(4deg); }
        }

        @keyframes gifWiggle {
            0%, 100% { transform: rotate(-8deg) translateY(0); }
            50% { transform: rotate(8deg) translateY(-8px); }
        }

        @keyframes gifFloat {
            0%, 100% { transform: translateY(0) rotate(-2deg); }
            50% { transform: translateY(-12px) rotate(2deg); }
        }

        .gif-bounce { animation: gifBounce 1.8s ease-in-out infinite; }
        .gif-pulse { animation: gifPulse 2s ease-in-out infinite; }
        .gif-wiggle { animation: gifWiggle 1.4s ease-in-out infinite; }
        .gif-float { animation: gifFloat 2.5s ease-in-out infinite; }

        @keyframes popIn {
            0% { transform: scale(0.4); opacity: 0; }
            70% { transform: scale(1.18); opacity: 1; }
            100% { transform: scale(1); opacity: 1; }
        }

        .animate-pop {
            animation: popIn 0.35s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        /* TOY 3D BUTTON STYLES WITH TACTILE PRESS EFFECTS */
        .btn-toy {
            box-shadow: 0px 5px 0px rgba(0, 0, 0, 0.2);
            transition: all 0.08s ease;
        }

        .btn-toy:active, .btn-toy.active-press {
            transform: translateY(3px);
            box-shadow: 0px 2px 0px rgba(0, 0, 0, 0.2);
        }

        .btn-correct {
            background-color: #22c55e !important;
            color: #ffffff !important;
            border-color: #15803d !important;
            box-shadow: 0px 4px 0px #15803d !important;
        }

        .btn-wrong {
            background-color: #ef4444 !important;
            color: #ffffff !important;
            border-color: #b91c1c !important;
            box-shadow: 0px 4px 0px #b91c1c !important;
        }

        .level-tab-active {

            color: #ffffff !important;
            border-color: #b45309 !important;
            transform: translateY(-2px);
            box-shadow: 0px 4px 0px #b45309 !important;
        }

            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 60;
        }
    </style>

        /* WEB AUDIO API SOUND EFFECTS */
        let audioCtx = null;

        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;

                if (type === 'correct') {
                    // Bright Pop Sound
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, now); // C5
                    osc.frequency.exponentialRampToValueAtTime(880, now + 0.12); // A5
                    gain.gain.setValueAtTime(0.3, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.12);
                    osc.start(now);
                    osc.stop(now + 0.12);
                } else if (type === 'wrong') {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(160, now);
                    osc.frequency.linearRampToValueAtTime(80, now + 0.25);
                    gain.gain.setValueAtTime(0.35, now);
                    gain.gain.exponentialRampToValueAtTime(0.01, now + 0.25);
                    osc.start(now);
                    osc.stop(now + 0.25);
                } else if (type === 'victory') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const noteOsc = ctx.createOscillator();
                        const noteGain = ctx.createGain();
                        noteOsc.connect(noteGain);
                        noteGain.connect(ctx.destination);
                        
                        noteOsc.type = 'triangle';
                        noteOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        noteGain.gain.setValueAtTime(0.25, now + idx * 0.1);
                        noteGain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.1 + 0.35);
                        
                        noteOsc.start(now + idx * 0.1);
                        noteOsc.stop(now + idx * 0.1 + 0.35);
                    });
                }
            } catch (err) {
                console.log("Audio exception:", err);
            }
        }

        /* DYNAMIC OBJECT / ANIMAL SOUND EFFECTS (Web Audio Synth Onomatopoeia) */
        function playItemSound(soundType) {
            if (!soundEnabled) return;
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.connect(gain);
                gain.connect(ctx.destination);

                switch (soundType) {
                    case 'meow':
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(600, now);
                        osc.frequency.linearRampToValueAtTime(750, now + 0.15);
                        osc.frequency.linearRampToValueAtTime(400, now + 0.4);
                        gain.gain.setValueAtTime(0.3, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                        osc.start(now); osc.stop(now + 0.4);
                        break;

                    case 'bark':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(300, now);
                        osc.frequency.linearRampToValueAtTime(120, now + 0.15);
                        gain.gain.setValueAtTime(0.4, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                        osc.start(now); osc.stop(now + 0.15);
                        break;

                    case 'quack':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(280, now);
                        osc.frequency.linearRampToValueAtTime(180, now + 0.2);
                        gain.gain.setValueAtTime(0.3, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now); osc.stop(now + 0.2);
                        break;

                    case 'roar':
                        osc.type = 'sawtooth';
                        osc.frequency.setValueAtTime(120, now);
                        osc.frequency.linearRampToValueAtTime(60, now + 0.6);
                        gain.gain.setValueAtTime(0.5, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.6);
                        osc.start(now); osc.stop(now + 0.6);
                        break;

                    case 'train': case 'siren': case 'honk':
                        osc.type = 'triangle';
                        osc.frequency.setValueAtTime(440, now);
                        osc.frequency.setValueAtTime(554, now + 0.15);
                        gain.gain.setValueAtTime(0.35, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.4);
                        osc.start(now); osc.stop(now + 0.4);
                        break;

                    default:
                        // Generic Playful Chime
                        osc.type = 'sine';
                        osc.frequency.setValueAtTime(587.33, now);
                        osc.frequency.exponentialRampToValueAtTime(880, now + 0.2);
                        gain.gain.setValueAtTime(0.3, now);
                        gain.gain.exponentialRampToValueAtTime(0.01, now + 0.2);
                        osc.start(now); osc.stop(now + 0.2);
                        break;
                }
            } catch (e) {
                console.log("Item sound error:", e);
            }
        }

        /* WEB SPEECH API (Spanish Voice Pronunciation) */
        function speakText(text) {
            if (!soundEnabled || !('speechSynthesis' in window)) return;
            try {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                utterance.lang = 'es-ES';
                utterance.rate = 0.95;
                utterance.pitch = 1.1;
                window.speechSynthesis.speak(utterance);
            } catch (e) {
                console.log("Speech synthesis error:", e);
            }
        }

        /* TOGGLE DIFFICULTY (Fácil: Teclas filtradas vs Normal: A-Z) */
        function toggleDifficulty() {
            isEasyMode = !isEasyMode;
            difficultyText.textContent = isEasyMode ? "Fácil" : "Normal";
            createKeyboard();
        }

        /* RENDER VIRTUAL KEYBOARD */
        function createKeyboard() {
            keyboardGrid.innerHTML = '';
            const currentItem = LEVELS_DATA[currentLevelIndex].items[currentItemIndex];
            
            let keyList = [];
            if (isEasyMode) {
                // Easy Mode: Unique letters of word + 3 random distractor letters
                const wordLetters = Array.from(new Set(currentItem.word.split('')));
                const remainingLetters = ALPHABET.filter(l => !wordLetters.includes(l));
                
                // Shuffle remaining and pick 3
                const distractors = remainingLetters.sort(() => 0.5 - Math.random()).slice(0, 3);
                keyList = [...wordLetters, ...distractors].sort();
            } else {
                // Normal Mode: Full 27 A-Z letters
                keyList = ALPHABET;
            }

            // Adjust grid columns dynamically if easy mode
            keyboardGrid.className = isEasyMode 
                ? 'grid grid-cols-4 sm:grid-cols-6 gap-1.5 sm:gap-2 w-full max-w-md mx-auto'
                : 'grid grid-cols-9 gap-1 sm:gap-1.5 w-full';

            keyList.forEach(letter => {
                const btn = document.createElement('button');
                btn.id = `key-${letter}`;
                btn.className = 'btn-toy bg-sky-100 hover:bg-sky-200 text-sky-950 border-2 border-sky-400 font-extrabold text-base sm:text-2xl rounded-xl py-1.5 sm:py-2 flex items-center justify-center transition-transform active:scale-95';
                btn.textContent = letter;
                btn.setAttribute('aria-label', `Letra ${letter}`);
                
                btn.addEventListener('pointerdown', (e) => {
                    e.preventDefault();
                    handleKeyPress(letter);
                });

                keyboardGrid.appendChild(btn);
            });
        }

        /* LOAD CURRENT ITEM / GAME LEVEL */
        function loadCurrentItem() {
            isWordCompleted = false;
            currentTypedIndex = 0;

            const levelData = LEVELS_DATA[currentLevelIndex];
            const currentItem = levelData.items[currentItemIndex];

            // Header updates
            currentLevelNum.textContent = currentLevelIndex + 1;
            levelProgressText.textContent = `${currentItemIndex + 1}/${levelData.items.length}`;
            badgeEl.textContent = levelData.badge;

            // Update Emoji & GIF animation class
            emojiEl.textContent = currentItem.emoji;
            emojiEl.className = `text-7xl sm:text-9xl filter drop-shadow-md cursor-pointer my-auto ${currentItem.anim}`;

            // Reset letter slots
            slotsContainer.innerHTML = '';
            for (let i = 0; i < currentItem.word.length; i++) {
                const slot = document.createElement('div');
                slot.id = `slot-${i}`;
                slot.className = 'letter-slot w-9 h-11 sm:w-14 sm:h-16 bg-amber-50 border-4 border-dashed border-amber-300 rounded-2xl flex items-center justify-center text-xl sm:text-3xl font-black text-amber-900 transition-all';
                slotsContainer.appendChild(slot);
            }

            // Hide victory modal
            victoryModal.classList.add('hidden');

            // Render adapted keyboard for current word
            createKeyboard();

            // Pronounce current item
            speakText(currentItem.word);
        }

        /* GIVE HINT FOR PRESCHOOLERS (Pista de Primera Letra) */
        function giveHint() {
            if (isWordCompleted) return;
            const currentItem = LEVELS_DATA[currentLevelIndex].items[currentItemIndex];
            const firstSlot = document.getElementById('slot-0');
            if (firstSlot && currentTypedIndex === 0) {
                firstSlot.textContent = currentItem.word[0];
                firstSlot.classList.add('text-sky-400', 'border-sky-400', 'animate-pulse');
                setTimeout(() => {
                    if (currentTypedIndex === 0) {
                        firstSlot.textContent = '';
                        firstSlot.classList.remove('text-sky-400', 'border-sky-400', 'animate-pulse');
                    }
                }, 2500);
            }
        }

        /* KEYPRESS VALIDATION LOGIC */
        function handleKeyPress(letter) {
            if (isWordCompleted) return;

            const currentItem = LEVELS_DATA[currentLevelIndex].items[currentItemIndex];
            const targetLetter = currentItem.word[currentTypedIndex];
            const keyBtn = document.getElementById(`key-${letter}`);

            if (letter === targetLetter) {
                // --- CORRECT LETTER ---
                playSound('correct');
                speakText(letter);

                const slot = document.getElementById(`slot-${currentTypedIndex}`);
                if (slot) {
                    slot.textContent = letter;
                    slot.className = 'letter-slot w-9 h-11 sm:w-14 sm:h-16 bg-emerald-400 border-4 border-emerald-600 rounded-2xl flex items-center justify-center text-xl sm:text-3xl font-black text-white shadow-lg animate-pop';
                }

                if (keyBtn) {
                    keyBtn.classList.add('btn-correct');
                    setTimeout(() => keyBtn.classList.remove('btn-correct'), 300);
                }

                currentTypedIndex++;

                // Check for Word Completion
                if (currentTypedIndex === currentItem.word.length) {
                    completeWord();
                }

            } else {
                // --- INCORRECT LETTER ---
                playSound('wrong');

                if (navigator.vibrate) {
                    navigator.vibrate(150);
                }

                if (keyBtn) {
                    keyBtn.classList.add('btn-wrong', 'animate-shake');
                    setTimeout(() => {
                        keyBtn.classList.remove('btn-wrong', 'animate-shake');
                    }, 400);
                }

                showToast("¡Sigue intentando! 💪");
            }
        }

        /* SHOW TOAST MESSAGE FOR ERRORS */
        let toastTimeout = null;
        function showToast(message) {
            clearTimeout(toastTimeout);
            toastBadge.textContent = message;
            toastBadge.className = 'bg-rose-500 text-white font-black text-xs sm:text-base px-4 py-0.5 rounded-full shadow-lg border-2 border-white flex items-center gap-1.5 animate-shake';

            toastEl.classList.remove('opacity-0', 'scale-90');
            toastEl.classList.add('opacity-100', 'scale-100');

            toastTimeout = setTimeout(() => {
                toastEl.classList.remove('opacity-100', 'scale-100');
                toastEl.classList.add('opacity-0', 'scale-90');
            }, 1200);
        }

        /* WORD COMPLETION & CELEBRATION */
        function completeWord() {
            isWordCompleted = true;
            score += 100;
            scoreText.textContent = `${score} PTS`;

            // Unlock Sticker
            unlockedStickers.add(`${currentLevelIndex}-${currentItemIndex}`);

            const currentItem = LEVELS_DATA[currentLevelIndex].items[currentItemIndex];

            // 1. Play Sound & Confetti Burst
            playSound('victory');
            startConfetti();

            // 2. Trigger Whole Screen Shake Effect
            appBody.classList.add('animate-screen-shake');
            setTimeout(() => {
                appBody.classList.remove('animate-screen-shake');
            }, 650);

            // 3. Spoken Celebration
            setTimeout(() => {
                speakText(`¡Felicitaciones! ¡Muy bien, es ${currentItem.word}!`);
            }, 250);

            // 4. Reveal Victory Modal
            setTimeout(() => {
                victoryWordText.textContent = `¡ES ${currentItem.word}! ${currentItem.emoji}`;
                victoryModal.classList.remove('hidden');
            }, 900);
        }

        /* STICKER ALBUM MODAL LOGIC */
        function toggleAlbumModal() {
            const isHidden = albumModal.classList.contains('hidden');
            if (isHidden) {
                renderAlbumGrid();
                albumModal.classList.remove('hidden');
            } else {
                albumModal.classList.add('hidden');
            }
        }

        function renderAlbumGrid() {
            albumGrid.innerHTML = '';
            LEVELS_DATA.forEach((level, lIdx) => {
                level.items.forEach((item, iIdx) => {
                    const isUnlocked = unlockedStickers.has(`${lIdx}-${iIdx}`);
                    const sticker = document.createElement('div');
                    sticker.className = `p-2 rounded-xl border-2 flex flex-col items-center justify-center text-center ${
                        isUnlocked 
                            ? 'bg-amber-100 border-amber-400 text-amber-900 shadow' 
                            : 'bg-slate-200 border-slate-300 text-slate-400 opacity-40 grayscale'
                    }`;
                    sticker.innerHTML = `
                        <span class="text-2xl sm:text-3xl">${isUnlocked ? item.emoji : '❓'}</span>
                        <span class="text-[10px] sm:text-xs font-black uppercase mt-1 truncate w-full">${isUnlocked ? item.word : '???'}</span>
                    `;
                    albumGrid.appendChild(sticker);
                });
            });
        }

        /* NEXT ITEM HANDLER */
        function nextItem() {
            stopConfetti();
            const levelData = LEVELS_DATA[currentLevelIndex];
            currentItemIndex = (currentItemIndex + 1) % levelData.items.length;
            loadCurrentItem();
        }

        /* SWITCH LEVEL (0 = Animals, 1 = Jobs, 2 = Objects) */
        function switchLevel(levelIdx) {
            currentLevelIndex = levelIdx;
            currentItemIndex = 0;

            // Update Tab UI States
            for (let i = 0; i < 3; i++) {
                const tabBtn = document.getElementById(`tab-level-${i + 1}`);
                if (i === levelIdx) {
                    tabBtn.classList.add('level-tab-active');
                } else {
                    tabBtn.classList.remove('level-tab-active');
                }
            }

            stopConfetti();
            loadCurrentItem();
        }

        /* CONFETTI SYSTEM */
        const canvas = document.getElementById('confetti-canvas');
        const ctx = canvas.getContext('2d');
        let confettiParticles = [];
        let confettiAnimationId = null;

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function startConfetti() {
            confettiParticles = [];
            const colors = ['#f43f5e', '#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899', '#facc15'];
            for (let i = 0; i < 110; i++) {
                confettiParticles.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height - canvas.height,
                    size: Math.random() * 12 + 6,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    speedY: Math.random() * 5 + 3,
                    speedX: Math.random() * 3 - 1.5,
                    angle: Math.random() * 360,
                    spin: Math.random() * 0.2 - 0.1
                });
            }
            if (!confettiAnimationId) {
                animateConfetti();
            }
        }

        function animateConfetti() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            let active = false;

            confettiParticles.forEach(p => {
                p.y += p.speedY;
                p.x += p.speedX;
                p.angle += p.spin;

                if (p.y < canvas.height) {
                    active = true;
                }

                ctx.save();
                ctx.translate(p.x, p.y);
                ctx.rotate(p.angle);
                ctx.fillStyle = p.color;
                ctx.fillRect(-p.size / 2, -p.size / 2, p.size, p.size);
                ctx.restore();
            });

            if (active) {
                confettiAnimationId = requestAnimationFrame(animateConfetti);
            } else {
                stopConfetti();
            }
        }

        function stopConfetti() {
            if (confettiAnimationId) {
                cancelAnimationFrame(confettiAnimationId);
                confettiAnimationId = null;
            }
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        /* EVENT LISTENERS & INITIALIZATION */
        window.addEventListener('keydown', (e) => {
            const key = e.key.toUpperCase();
            if (ALPHABET.includes(key)) {
                handleKeyPress(key);
            } else if (e.key === 'Enter' && !victoryModal.classList.contains('hidden')) {
                nextItem();
            }
        });

        // Click Emoji Card to hear sound + TTS repeat
        emojiEl.addEventListener('click', () => {
            const currentItem = LEVELS_DATA[currentLevelIndex].items[currentItemIndex];
            playItemSound(currentItem.soundType);
            setTimeout(() => {
                speakText(currentItem.word);
            }, 300);
            emojiEl.classList.add('animate-pop');
            setTimeout(() => emojiEl.classList.remove('animate-pop'), 350);
        });

        // Sound Toggle Button
        btnAudioToggle.addEventListener('click', () => {
            soundEnabled = !soundEnabled;
            btnAudioToggle.textContent = soundEnabled ? '🔊' : '🔇';
            btnAudioToggle.classList.toggle('bg-rose-200', !soundEnabled);
        });

        // Start Application
        window.onload = () => {
            loadCurrentItem();
        };
    </script>
